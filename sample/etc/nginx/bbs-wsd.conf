# bbs-wsd behind nginx: `wss://bbs.example/bbs` for web clients, with TLS
# terminated here, and the client address and the TLS flag named for bbs-wsd
# in request headers.

upstream bbs_wsd {
    # bbs-wsd over TCP...
    server 127.0.0.1:8081;
    # ... or over a unix socket
    # server unix:/home/bbs/run/bbs-wsd.sock;
    keepalive 0;
}

map $scheme $bbs_secure {
    https   1;
    default 0;
}

# wsd reads an IPv4 address as `ip:port`, and an IPv6 address as `[ip6]:port`.
map $remote_addr $bbs_client_ip {
    ~:      "[$remote_addr]:$remote_port";
    default "$remote_addr:$remote_port";
}

server {
    listen 443 ssl;
    server_name bbs.example;

    ssl_certificate     /etc/ssl/bbs.example.pem;
    ssl_certificate_key /etc/ssl/bbs.example.key;

    location = /bbs {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_set_header X-BBS-Client-IP $bbs_client_ip;
        proxy_set_header X-BBS-Secure $bbs_secure;

        proxy_pass http://bbs_wsd;
    }
}
