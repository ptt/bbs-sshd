# Server bind addresses and ports. A TCP address, a unix socket file as
# `unix:/path/to/sock`, or a unix abstract socket as `unix:@name`.
bind = [
    "127.0.0.1:8081",
    # "unix:/home/bbs/run/bbs-wsd.sock",
]

# Optional: Set uid. (default: no set)
uid = 9999

# Optional: Set gid. (default: no set)
gid = 99

# Optional: Number of worker threads. (default: 0, single threaded)
workers = 4

# Optional: Set max number of open files. (default: no set)
nofile = 10000

# Optional: Write pid file. (default: no pid file)
pid_file = "/home/bbs/run/bbs-wsd.pid"

# Optional: Log level. (available: ERROR, WARN, INFO, DEBUG, TRACE; default: INFO)
#log_level = "TRACE"

# Paths to logind, multiple entries supported. Round-robin.
logind_paths = [
    "/home/bbs/run/logind.connfwd.sock",
]

# Optional: WebSocket endpoint path.
#
# Subprotocol of "telnet" is negotiated, or assumed if the subprotocol header
# is not present.
path = "/bbs"

# Optional: Header that tells whether the session came in a secured channel.
# This secure bit is reported to `logind`. The header value must be
# `0` (insecure) or `1` (secure). The header must be present and valid,
# otherwise the request is rejected.
#
# An empty string disables the header, and every session is assumed insecure.
# (default: "X-BBS-Secure")
secure_header = "X-BBS-Secure"

# Optional: Header that carries the client address as `ip:port` (an IPv6
# address in brackets). There can be multiple values of this header, and the
# first valid value is used. The header must be present and valid, otherwise
# the request is rejected.
#
# An empty string disables the header, and clients are named by their TCP peer
# address then. A unix socket bind is not supported in this case.
# (default: "X-BBS-Client-IP")
ip_header = "X-BBS-Client-IP"

# Optional: Header that carries the server local port the client connected to.
# This port will be reported to `logind` as `lport`. The header must be present
# and valid, otherwise the request is rejected. If there are multiple values,
# the first valid value is used.
#
# An empty string disables the header, and the listening port is reported for a
# TCP server; 0 is reported for an unix socket server.
# (default: "X-BBS-Local-Port")
lport_header = "X-BBS-Local-Port"
