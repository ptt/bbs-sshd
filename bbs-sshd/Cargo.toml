[package]
name = "bbs-sshd"
version = "0.3.0"
edition = "2024"

# SSH server that bridges SSH clients to `logind`.

[dependencies]
bbs-common = { path = "../bbs-common" }
bytes = "1.12.1"
russh = "0.64.1"
tokio = {
    version = "1.54.1",
    features = ["rt", "net", "io-util", "sync", "time", "macros"],
}
log = { version = "0.4.34", features = ["serde", "release_max_level_trace"] }
clap = { version = "4.6.7", features = ["cargo", "derive"] }
serde = "1.0.229"
serde_derive = "1.0.229"
